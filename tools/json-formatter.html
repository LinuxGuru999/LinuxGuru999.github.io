<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free JSON Formatter — Shotgun Goods</title><meta name="description" content="Format and validate JSON instantly in your browser. No signup, no upload."><style>body{font:16px/1.6 system-ui,sans-serif;max-width:780px;margin:40px auto;padding:0 20px;color:#e2e8f0;background:#0f172a}h1{font-size:1.8rem}textarea{width:100%;height:260px;background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:12px;font:14px monospace}button{background:#f59e0b;color:#111;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}a{color:#38bdf8}.card{border:1px solid #334155;border-radius:12px;padding:18px;background:#1e293b;margin-top:20px}pre{white-space:pre-wrap;word-break:break-word}</style></head><body>
<h1>Free JSON Formatter</h1><p>Paste JSON, click Format. Nothing is uploaded — it all runs in your browser.</p>
<textarea id="input" placeholder='{"hello":"world"}'></textarea><p><button id="go">Format &amp; validate</button> <button id="min">Minify</button></p><pre id="out"></pre>
<div class="card"><strong>Need more tools?</strong> Browse Shotgun Goods: <a href="../">the storefront</a> — prompts, scripts and templates, no signup.</div>
<script>const i=document.getElementById('input'),o=document.getElementById('out');function run(min){try{const v=JSON.parse(i.value);o.textContent=min?JSON.stringify(v):JSON.stringify(v,null,2)}catch(e){o.textContent='Invalid JSON: '+e.message}}document.getElementById('go').onclick=()=>run(false);document.getElementById('min').onclick=()=>run(true);</script>
</body></html>
