<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevKit Playground — try before you buy</title><meta name="description" content="Try the DevKit CLI utilities in your browser. No signup, nothing uploaded."><style>body{font:16px/1.6 system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;color:#e2e8f0;background:#0f172a}button{background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:8px;padding:8px 14px;cursor:pointer;margin:2px}button.on{background:#f59e0b;color:#111}textarea{width:100%;height:150px;background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:12px;font:14px monospace}pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #334155;border-radius:8px;padding:14px;min-height:90px}a{color:#38bdf8}.card{border:1px solid #334155;border-radius:12px;padding:18px;background:#1e293b;margin-top:18px}</style></head><body><p><a href="../">Storefront</a> · <a href="index.html">All free tools</a></p><h1>DevKit Playground</h1><p>Try the utilities from DevKit CLI and DevKit Pro right here. Everything runs locally in your browser — nothing is uploaded.</p><div id="tabs"></div><div id="panel"></div><pre id="out"></pre><div class="card"><strong>Like it?</strong> The full CLI adds these utilities offline, with install scripts and source. <a href="../shotgun-devkit-cli/">DevKit CLI — $19</a> · <a href="../shotgun-devkit-pro/">DevKit Pro — $29</a></div><script>const tools=[{id:"json",label:"JSON format",run:v=>JSON.stringify(JSON.parse(v),null,2)},{id:"base64",label:"Base64 encode",run:v=>btoa(unescape(encodeURIComponent(v)))},{id:"base64d",label:"Base64 decode",run:v=>decodeURIComponent(escape(atob(v)))},{id:"uuid",label:"UUIDs",run:v=>Array.from({length:Number(v)||1},()=>crypto.randomUUID()).join("\n")},{id:"regex",label:"Regex matches",run:v=>{const [p,f="",...rest]=v.split("\n");return "Matches: "+((rest.join("\n").match(new RegExp(p,f))||[]).length)}},{id:"log",label:"Clean logs",run:v=>v.split("\n").filter(l=>l&&!/DEBUG|TRACE/i.test(l)).join("\n")}];let active=0;const tabs=document.getElementById("tabs"),panel=document.getElementById("panel"),out=document.getElementById("out");tools.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t.label;b.onclick=()=>{active=i;render()};tabs.appendChild(b)});function render(){[...tabs.children].forEach((b,i)=>b.className=i===active?"on":"");panel.innerHTML="<textarea id=input placeholder=\"Paste input, then click Run\"></textarea><p><button onclick=go()>Run</button></p>";out.textContent=""}function go(){const v=document.getElementById("input").value;try{out.textContent=tools[active].run(v)}catch(e){out.textContent="Error: "+e.message}}render();</script></body></html>
