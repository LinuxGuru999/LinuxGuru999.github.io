<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Regex Tester — Shotgun Goods</title><meta name="description" content="Test a regular expression against text with a live match count."><style>body{font:16px/1.6 system-ui,sans-serif;max-width:780px;margin:40px auto;padding:0 20px;color:#e2e8f0;background:#0f172a}h1{font-size:1.8rem}textarea{width:100%;height:220px;background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:12px;font:14px monospace}input{background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:8px;width:100%}button{background:#f59e0b;color:#111;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}a{color:#38bdf8}.card{border:1px solid #334155;border-radius:12px;padding:18px;background:#1e293b;margin-top:20px}pre{white-space:pre-wrap;word-break:break-word}.nav a{margin-right:14px}</style></head><body><p class="nav"><a href="../">Storefront</a><a href="index.html">All free tools</a></p><h1>Free Regex Tester</h1><p>Test a regular expression against text with a live match count.</p><p>Pattern: <input id="pat" placeholder="\bword\b"></p><p>Flags: <input id="flags" value="gi" style="width:80px"></p><textarea id="input" placeholder="Text to test"></textarea><p><button id="go">Test</button></p><pre id="out"></pre><div class="card">Want more like this? <a href="../">Shotgun Goods</a> — prompts, scripts and templates, no signup.</div><script>document.getElementById('go').onclick=()=>{try{const r=new RegExp(document.getElementById('pat').value,document.getElementById('flags').value);const t=document.getElementById('input').value;document.getElementById('out').textContent='Matches: '+(t.match(r)||[]).length}catch(e){document.getElementById('out').textContent='Error: '+e.message}};</script></body></html>
